<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sauvetage CA2 — Parcours, chronométrie & observation</title>
<meta name="description" content="Créer, visualiser et chronométrer des parcours de sauvetage aquatique (CA2) — N'EPS numérique, Académie de Nantes.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0062C4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ Barre d'application ============ -->
<header class="appbar" id="appbar">
  <button class="iconbtn" id="btnBack" aria-label="Retour" title="Retour">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 class="appbar-title" id="appTitle">Sauvetage CA2</h1>
  <button class="chip" id="chipCurrent" title="Changer de parcours">
    <svg viewBox="0 0 24 24"><path d="M2 16c2 0 2-1.5 4-1.5S8 16 10 16s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M2 20c2 0 2-1.5 4-1.5S8 20 10 20s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><circle cx="12" cy="6" r="2.5"/><path d="M12 8.5v3"/></svg>
    <span id="chipCurrentName">—</span>
  </button>
</header>

<main>

<!-- ============ ACCUEIL ============ -->
<section class="view" data-view="home"></section>

<!-- ============ BIBLIOTHÈQUE ============ -->
<section class="view" data-view="library">
  <div class="wrap">
    <div class="toolbar">
      <button class="btn blue" data-action="newParcours"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nouveau parcours</button>
      <label class="btn ghost" for="fileImport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Importer (.json)</label>
      <input type="file" id="fileImport" accept="application/json,.json" multiple hidden>
    </div>
    <h3 class="section-title">Mes parcours</h3>
    <div class="grid-cards" id="libUser"></div>
    <h3 class="section-title">Modèles</h3>
    <div class="grid-cards" id="libBuiltin"></div>
  </div>
</section>

<!-- ============ ÉDITEUR ============ -->
<section class="view" data-view="editor">
  <div class="wrap editor">
    <div class="editor-side">
      <div class="card">
        <label class="field">
          <span class="field-lbl">Nom du parcours</span>
          <input type="text" id="edName" maxlength="80" placeholder="ex. Parcours niveau 2 — 2nde 4" autocomplete="off">
        </label>
        <div class="field">
          <span class="field-lbl">Nombre de longueurs (25 m)</span>
          <div class="stepper">
            <button class="btn ghost sq" id="edLenMinus" aria-label="Retirer une longueur">−</button>
            <output id="edLenVal">4</output>
            <button class="btn ghost sq" id="edLenPlus" aria-label="Ajouter une longueur">+</button>
            <span class="muted small" id="edLenMeters">100 m</span>
          </div>
        </div>
        <div class="field">
          <span class="field-lbl">Entrée dans l'eau</span>
          <div class="seg seg-text" id="edEntree" role="group" aria-label="Entrée dans l'eau">
            <button type="button" data-entree="dive">Plongeon</button><button type="button" data-entree="jump">Saut droit</button><button type="button" data-entree="water">Dans l'eau</button>
          </div>
        </div>
      </div>
      <div class="card schema-card">
        <canvas class="schema" id="edSchema"></canvas>
        <ul class="warnings" id="edWarnings"></ul>
      </div>
      <div class="btnrow sticky-actions">
        <button class="btn green lg" id="edSave"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>Enregistrer et utiliser</button>
        <button class="btn ghost" id="edCancel">Annuler</button>
      </div>
    </div>
    <div class="editor-main" id="edLengths"></div>
  </div>
</section>

<!-- ============ VISUALISATION ============ -->
<section class="view" data-view="view">
  <div class="viewer">
    <div class="viewer-bar">
      <button class="btn green" id="simPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Lancer</span></button>
      <button class="btn ghost" id="simReset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Recommencer</button>
      <div class="seg" id="simSpeed" role="group" aria-label="Vitesse">
        <button data-speed="1">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
      </div>
      <div class="sim-status">
        <span id="simStatus">Prêt</span>
        <div class="progress"><i id="simProgress"></i></div>
      </div>
    </div>
    <div class="viewer-canvases">
      <figure class="viewbox"><figcaption>Vue de dessus <small id="simPairLbl"></small></figcaption><div class="canvas-host"><canvas id="cvTop"></canvas></div></figure>
      <figure class="viewbox"><figcaption>Vue de côté</figcaption><div class="canvas-host"><canvas id="cvSide"></canvas></div></figure>
    </div>
  </div>
</section>

<!-- ============ CHRONOMÉTRIE ============ -->
<section class="view" data-view="chrono">
  <div class="wrap chrono">
    <div class="chrono-main">
      <div class="card passage" id="stCtx" hidden></div>
      <div class="card student" id="stFree">
        <input type="text" id="stNom" placeholder="NOM" autocomplete="off" class="upper">
        <input type="text" id="stPrenom" placeholder="Prénom" autocomplete="off">
        <input type="text" id="stClasse" placeholder="Classe" autocomplete="off" list="classesList" class="classe">
        <datalist id="classesList"></datalist>
      </div>

      <div class="clock" id="chronoClock" aria-live="off">00:00.0</div>

      <button class="tapbtn" id="tapBtn">
        <span class="tap-label" id="tapLabel">Départ</span>
        <span class="tap-sub" id="tapSub">Aller 1</span>
      </button>

      <div class="chrono-tools">
        <div class="faults">
          <button class="btn ghost sq" id="faultMinus" aria-label="Retirer une faute">−</button>
          <button class="btn orange fault-btn" id="faultPlus">Faute <b id="faultCount">0</b></button>
        </div>
        <button class="btn ghost" id="tapUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Annuler le dernier</button>
        <button class="btn ghost" id="chronoReset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Réinitialiser</button>
      </div>

      <div class="card finish-card" id="finishCard" hidden>
        <div class="finish-title">Arrivée — <span id="finishTime">00:00.0</span></div>
        <div class="finish-speed" id="finishSpeed" hidden></div>
        <div class="btnrow">
          <button class="btn green lg" id="btnSaveResult"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>Enregistrer le passage</button>
          <button class="btn ghost" id="btnResultPng"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Fiche PNG</button>
          <button class="btn blue" id="btnNextStudent">Élève suivant →</button>
        </div>
      </div>

      <label class="switch">
        <input type="checkbox" id="optTimeObs" checked>
        <span>Chronométrer aussi les obstacles</span>
      </label>
    </div>

    <div class="chrono-side">
      <div class="card obs-card" id="obsCard" hidden></div>
      <div class="card">
        <canvas class="schema" id="chronoSchema"></canvas>
      </div>
      <div class="card">
        <div class="kpis">
          <div><span>Longueurs</span><b id="kLen">—</b></div>
          <div><span>Obstacles</span><b id="kObs">—</b></div>
          <div><span>Nage seule</span><b id="kSwim">—</b></div>
        </div>
      </div>
      <div class="card">
        <ol class="timeline" id="timeline"></ol>
      </div>
    </div>
  </div>
</section>

<!-- ============ RÉSULTATS ============ -->
<section class="view" data-view="results">
  <div class="wrap">
    <div class="toolbar">
      <input type="search" id="resFilter" placeholder="Filtrer (nom, classe, parcours)…" autocomplete="off">
      <button class="btn green" id="resCsv"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Exporter CSV</button>
      <button class="btn ghost danger" id="resClear">Tout effacer</button>
    </div>
    <div id="resList" class="res-list"></div>
  </div>
</section>

</main>

<footer class="credit">N'EPS numérique · by Quentin Delisle</footer>

<!-- Modale générique -->
<dialog id="dlg">
  <form method="dialog" class="dlg">
    <h3 id="dlgTitle"></h3>
    <p id="dlgMsg"></p>
    <input type="text" id="dlgInput" hidden autocomplete="off">
    <div class="btnrow end">
      <button class="btn ghost" value="cancel" id="dlgCancel">Annuler</button>
      <button class="btn blue" value="ok" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>
<div id="toasts" aria-live="polite"></div>

<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/zxing-reader.js"></script>
<script src="lib/xlsx.full.min.js" defer></script>
<script src="js/store.js"></script>
<script src="js/schema.js"></script>
<script src="js/sim.js"></script>
<script src="js/chrono.js"></script>
<script src="js/export.js"></script>
<script src="js/qr.js"></script>
<script src="js/classe.js"></script>
<script src="js/app.js"></script>
<script src="js/modes.js"></script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
